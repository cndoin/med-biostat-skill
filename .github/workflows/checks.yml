name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Tier 0 纯度验证：**不装任何第三方包**，纯标准库必须能跑通。
  # 这条最容易被忽视 —— 一旦有人不小心在 scripts/ 里 import 了 numpy，
  # 「任何裸 Python 都能跑」这个承诺就悄悄失效了。
  # ────────────────────────────────────────────────────────────────────────
  tier0-stdlib:
    name: Tier 0 (stdlib only, py3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 确认未安装 numpy（Tier 0 必须零依赖）
        run: |
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'CI 环境不应预装 numpy'"
          python -VV

      - name: 全量自检（Tier 1 用例应 SKIP，不是 FAIL）
        run: python tests/run_all.py

      - name: 双层能力探测
        run: python scripts/capabilities.py

      - name: 自动触发覆盖
        run: python scripts/trigger_check.py

      - name: 判定门脚本自检（正反双向）
        run: |
          python scripts/gates.py --init --project "$RUNNER_TEMP/gates_ci" \
            --min-detectable-rate 0.6 --min-positive-control-hits 1 --json
          python scripts/gates.py --check --project "$RUNNER_TEMP/gates_ci" --json
          # 负向：事后放宽必须被拒（否则 CI 证明不了这条约束真的存在）
          ! python scripts/gates.py --amend --project "$RUNNER_TEMP/gates_ci" \
            --gate G2 --min-detectable-rate 0.3 --reason "ci-negative" --json

      - name: 混杂审计扩展项（缺输入须报 cannot_check）
        run: |
          python scripts/confounder_audit.py --project "$RUNNER_TEMP/audit_ci" --json

  # ────────────────────────────────────────────────────────────────────────
  # 完整验证：跨平台 × 跨 Python 版本，装齐 Tier 1 科学栈。
  # ────────────────────────────────────────────────────────────────────────
  full:
    name: full (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装 Tier 1 科学栈
        run: |
          python -m pip install --upgrade pip
          pip install -r vendor/requirements.txt

      - name: 全量自检（Tier 0 + Tier 1）
        run: python tests/run_all.py

      - name: 能力探测（两层都应就绪）
        run: python scripts/capabilities.py

      - name: 环境报告
        run: python scripts/doctor.py

      - name: 自动触发覆盖
        run: python scripts/trigger_check.py
