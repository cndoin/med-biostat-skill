<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{--fg:#1a1a1a;--muted:#5a5a5a;--line:#d8d8d8;--bg:#ffffff;--accent:#0f4c81;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Times New Roman","Songti SC","Source Han Serif SC",serif;
       font-size:11pt;line-height:1.65;}
  .page{max-width:820px;margin:0 auto;padding:48px 56px;}
  h1{font-size:20pt;line-height:1.3;margin:0 0 8px;}
  h2{font-size:14pt;margin:28px 0 10px;border-bottom:1px solid var(--line);padding-bottom:4px;}
  h3{font-size:12pt;margin:20px 0 8px;}
  p{margin:8px 0;text-align:justify;}
  .meta{color:var(--muted);font-size:10pt;margin-bottom:24px;}
  table{border-collapse:collapse;width:100%;font-size:10pt;margin:12px 0;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
  th{background:#f5f7fa;font-weight:600;}
  code{font-family:Consolas,Menlo,monospace;font-size:9.5pt;background:#f2f2f2;padding:1px 4px;border-radius:3px;}
  .callout{border-left:3px solid var(--accent);background:#f5f8fb;padding:10px 14px;margin:14px 0;}
  .warn{border-left:3px solid #b00020;background:#fdf3f4;padding:10px 14px;margin:14px 0;}
  .num{font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="page">
<!-- BODY_START 以下为正文片段，由 md_to_html 注入；禁止在此处改写数字 -->
{{BODY}}
<!-- BODY_END -->
</div>
</body>
</html>
