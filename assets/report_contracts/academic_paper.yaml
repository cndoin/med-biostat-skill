# 报告契约 · 学术论文（academic_paper）
# 用途：S6 产出层。report_pipeline.py 读取本契约校验结构完整性。
# 规范依据：按研究类型在 reporting_standards.md 里选 STROBE / STROBE-MR / TRIPOD+AI / PRISMA。
id: academic_paper
version: "1.0.0"
required_sections:
  - id: abstract
    title: 摘要
    max_words: 250          # 眼科期刊摘要中位 250 词（Science Editing 2026）
    must_contain: [背景, 方法, 结果, 结论]
  - id: introduction
    title: 引言
  - id: methods
    title: 方法
    must_contain: [数据来源与版本, 统计方法, 判定门与预设阈值, 软件与版本]
  - id: results
    title: 结果
    must_contain: [效应量, 置信区间, 检验次数]
  - id: discussion
    title: 讨论
    must_contain: [局限, 无法排除的混杂]
  - id: conclusion
    title: 结论
  - id: data_availability
    title: 数据与代码可用性
optional_sections:
  - id: supplementary
    title: 补充材料
constraints:
  main_figures: {min: 4, max: 8}     # 主图 4-8 张，眼科上限中位 6
  body_words: {target: 4000}          # 正文词数中位 4,000
  require_source_data: true           # 每张图的数字都能由脚本重跑
  forbid_rewrite_of_numbers: true     # 含数字段落禁止写作代理改写
quality_gates:
  - id: G-NUM-TRACE
    desc: 每个报告内数字都能在 logs/ 或 tables/ 找到出处
    fail_action: 拒绝出稿
  - id: G-CALIBRATION
    desc: 预测模型必须同时给区分度 + 校准度 + 决策曲线
    fail_action: 拒绝出稿并报红线 R8
